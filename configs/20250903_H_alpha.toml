[series]
id = "20250903_H_alpha"
source = "ground"
observatory_code = "217"
filter = "H_alpha"
expected_frames = 99

[inputs]
summary = "../outputs/two_zone_result_20250903_H_alpha.csv"
stacks = "../outputs/two_zone_asteroid_stacks_20250903_H_alpha.csv"
frame_quality = "../outputs/two_zone_frame_quality_20250903_H_alpha.csv"

[reduction]
frame_glob = "../Fredschaaf/20250903/7065_H_alpha_4_*_wcs.fits"
catalog = "../Fredschaaf/20250903/gaia_dr3_field_g19_5.csv"
inner_radius_arcmin = 4.0
outer_radius_arcmin = 10.0
group_size = 20
detector_margin_px = 20
astrometric_mag_min = 5.0
astrometric_mag_max = 16.5
distortion_mag_max = 19.5
star_half_box_px = 10
stack_half_size_px = 20
psf_half_size_px = 7
psf_radius_arcmin = 8.0
psf_mag_min = 14.5
psf_mag_max = 16.5
affine_clip_iterations = 4
affine_clip_sigma = 3.0
affine_min_stars = 6
affine_min_clip_radius_mas = 100.0
frame_rejection_sigma = 3.0
psf_aperture_radius_px = 5.5
psf_min_flux = 5000.0
psf_saturation_level = 50000.0
psf_fit_max_offset_px = 5.0
psf_clip_sigma = 3.0
stack_clip_sigma = 3.0
background_clip_sigma = 3.0
appulse_source_id = 32637666936447744
appulse_maximum_offset_px = 3.0
appulse_min_frame_psf_stars = 3
appulse_background_order = 1
# Independent same-night R-series position. H-alpha is evaluated here with
# signed forced photometry; a displaced maximum from a blind positive search
# is not promoted to an asteroid detection.
detection_seed_offset_mas = [34.82, 23.32]

[ephemeris]
id = "legacy-linear-horizons"
reference_utc = "2025-09-03T21:20:00"
ra_deg = 43.48787
dec_deg = 15.44055
ra_rate_arcsec_per_hour = 10.48579
dec_rate_arcsec_per_hour = -3.52047

[quality]
# Operational regression guards, copied unchanged from the R-series config.
min_stacks = 5
min_frames_per_stack = 10
min_median_stack_snr = 8.0
max_rejected_fraction = 0.25
max_adjusted_rms_mas = 100.0
